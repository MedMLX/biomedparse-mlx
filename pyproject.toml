[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biomedparse-mlx"
version = "0.1.5"
description = "Segment 3D medical images from text prompts with Microsoft BioMedParse v2 and native MLX"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "biomedparse",
  "segmentation",
  "text-prompt",
  "ct",
  "mri",
]
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "medmlx-core==0.2.6",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "huggingface-hub>=1,<2",
  "numpy>=2,<3",
  "tokenizers>=0.22,<0.23",
  "nibabel>=5.3,<6",
  "pillow>=13,<14",
  "pydicom>=3,<4",
  "scikit-image>=0.25,<1",
]

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/biomedparse-mlx/blob/v0.1.5/README.md"
Repository = "https://github.com/MedMLX/biomedparse-mlx"
Issues = "https://github.com/MedMLX/biomedparse-mlx/issues"
Weights = "https://huggingface.co/MedMLX/biomedparse-v2-mlx"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.scripts]
biomedparse-mlx = "biomedparse_mlx.cli:main"

[project.entry-points."medmlx.models"]
biomedparse-v2 = "biomedparse_mlx.medmlx:MODEL"

[project.optional-dependencies]
assets = ["huggingface-hub>=1,<2"]
dev = ["pyright==1.1.414", "ruff>=0.13,<1", "pytest>=8.4,<10"]
oracle = ["torch>=2.6,<3", "timm>=1,<2", "fvcore>=0.1.5", "hydra-core>=1.3.8,<2", "safetensors>=0.6,<1", "transformers>=5,<6", "simpleitk>=2.4,<3"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/biomedparse_mlx"]


[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251", "TID252", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["metal: evaluated native MLX execution", "oracle: upstream PyTorch comparison"]

[tool.pyright]
include = ["src", "tests", "typings"]
stubPath = "typings"
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md", "CLAUDE.md", ".claude", ".codex", ".cursor"]
only-include = [
  "src/biomedparse_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
